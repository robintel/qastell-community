# QAstell Security Audit Demo
#
# Demonstrates QAstell integration in a CI/CD pipeline.
# Uses the same approach as the README one-liners, extended with
# Corporate-tier report generation (HTML, JSON, SARIF, JUnit).
#
# Trigger: manual only (workflow_dispatch) — only repo collaborators
# with write access can trigger this. An additional actor check
# restricts execution to the repository owner.
#
# Secret required: QASTELL_LICENSE (Corporate license key)

name: QAstell Security Demo

on:
  workflow_dispatch:

permissions:
  security-events: write
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── Playwright ──────────────────────────────────────────────
  playwright:
    name: Playwright Security Audit
    runs-on: ubuntu-latest
    if: github.actor == 'robintel'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scaffold project and install dependencies
        run: |
          mkdir -p qastell-demo/tests qastell-demo/reports
          cd qastell-demo
          npm init -y
          npm i qastell @playwright/test
          npx playwright install --with-deps chromium

      - name: Create Playwright config
        working-directory: qastell-demo
        run: |
          cat > playwright.config.ts << 'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            workers: 1,
            reporter: [['list']],
            use: { browserName: 'chromium' },
          });
          EOF

      - name: Create test file
        working-directory: qastell-demo
        run: |
          cat > tests/security-demo.spec.ts << 'EOF'
          import { test } from '@playwright/test';
          import { SecurityAuditor, formatters } from 'qastell';
          import * as fs from 'fs';
          import * as path from 'path';

          const REPORTS_DIR = path.join(process.cwd(), 'reports');
          const BASE_URL = 'https://the-internet.herokuapp.com';

          const PAGES = [
            { path: '/', name: 'Homepage' },
            { path: '/login', name: 'Login Page' },
            { path: '/inputs', name: 'Inputs Page' },
            { path: '/dropdown', name: 'Dropdown Page' },
            { path: '/checkboxes', name: 'Checkboxes Page' },
          ];

          test.describe('QAstell Security Audit Demo', () => {
            test.setTimeout(60_000);

            for (const target of PAGES) {
              test(`audit ${target.name} (${target.path})`, async ({ page }) => {
                await page.goto(`${BASE_URL}${target.path}`);
                await page.waitForLoadState('networkidle');

                const auditor = new SecurityAuditor(page);
                const results = await auditor.audit();

                const slug = target.name.toLowerCase().replace(/\s+/g, '-');

                fs.writeFileSync(
                  path.join(REPORTS_DIR, `${slug}.html`),
                  results.toHTML()
                );
                fs.writeFileSync(
                  path.join(REPORTS_DIR, `${slug}-summary.html`),
                  results.toSummaryHTML()
                );
                fs.writeFileSync(
                  path.join(REPORTS_DIR, `${slug}.json`),
                  results.toJSON()
                );
                fs.writeFileSync(
                  path.join(REPORTS_DIR, `${slug}.sarif`),
                  results.toSARIF()
                );
                fs.writeFileSync(
                  path.join(REPORTS_DIR, `${slug}.junit.xml`),
                  results.toJUnit()
                );

                const md = formatters.markdown(results.raw, { tier: results.tier });
                fs.writeFileSync(
                  path.join(REPORTS_DIR, `${slug}.md`),
                  md
                );

                console.log(`${target.name}: ${results.summary.total} issues`);
                console.log(`  Critical: ${results.summary.bySeverity.critical}`);
                console.log(`  High:     ${results.summary.bySeverity.high}`);
                console.log(`  Medium:   ${results.summary.bySeverity.medium}`);
                console.log(`  Low:      ${results.summary.bySeverity.low}`);
                console.log(`  Info:     ${results.summary.bySeverity.info}`);

                // Fail the test if security violations are found
                await auditor.assertNoViolations();
              });
            }
          });
          EOF

      - name: Run security audits
        working-directory: qastell-demo
        env:
          QASTELL_LICENSE: ${{ secrets.QASTELL_LICENSE }}
        run: npx playwright test security-demo --reporter=list --workers=1

      - name: Post markdown summary to job
        if: always()
        working-directory: qastell-demo
        run: |
          echo "# QAstell Playwright Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for md_file in reports/*.md; do
            if [ -f "$md_file" ]; then
              cat "$md_file" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "---" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Build composite findings file and SARIF for GitHub
        if: always()
        run: |
          node << 'BUILDsarif'
          const fs = require('fs');
          const path = require('path');

          const reportsDir = path.join(process.cwd(), 'qastell-demo', 'reports');
          const repoRoot = process.env.GITHUB_WORKSPACE || process.cwd();
          const COMPOSITE_FILE = 'security-audit-results-playwright.html';

          // ── 1. Read and merge all per-page SARIF files ──────────────
          const sarifFiles = fs.readdirSync(reportsDir)
            .filter(f => f.endsWith('.sarif') && f !== 'combined.sarif');

          if (sarifFiles.length === 0) {
            console.log('No SARIF files found');
            process.exit(0);
          }

          const base = JSON.parse(fs.readFileSync(path.join(reportsDir, sarifFiles[0]), 'utf8'));
          const run = base.runs[0];
          const rulesMap = new Map();
          run.tool.driver.rules.forEach(r => rulesMap.set(r.id, r));
          const allResults = [...run.results];

          for (let i = 1; i < sarifFiles.length; i++) {
            const sarif = JSON.parse(fs.readFileSync(path.join(reportsDir, sarifFiles[i]), 'utf8'));
            const r = sarif.runs[0];
            r.tool.driver.rules.forEach(rule => rulesMap.set(rule.id, rule));
            allResults.push(...r.results);
          }

          run.tool.driver.rules = [...rulesMap.values()];
          run.results = allResults;

          const ruleIds = run.tool.driver.rules.map(r => r.id);
          for (const result of run.results) {
            result.ruleIndex = ruleIds.indexOf(result.ruleId);
          }

          // ── 2. Build composite file and rewrite SARIF in one pass ───
          // Group results by page URL (from the original artifact URI)
          const resultsByPage = new Map();
          for (const result of run.results) {
            const uri = result.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'unknown';
            if (!resultsByPage.has(uri)) resultsByPage.set(uri, []);
            resultsByPage.get(uri).push(result);
          }

          const lines = [];
          lines.push('<!--');
          lines.push('  QAstell Security Audit Results — Playwright');
          lines.push(`  Generated: ${new Date().toISOString()}`);
          lines.push(`  Pages scanned: ${resultsByPage.size}`);
          lines.push(`  Total findings: ${run.results.length}`);
          lines.push('');
          lines.push('  This file is auto-generated during the CI workflow.');
          lines.push('  Each finding references the HTML element that triggered it.');
          lines.push('  GitHub Code Scanning alerts link to specific lines below.');
          lines.push('-->');
          lines.push('');

          for (const [pageUrl, results] of resultsByPage) {
            // Page header
            const divider = '\u2550'.repeat(62);
            lines.push(`<!-- ${divider} -->`);
            lines.push(`<!-- Page: ${pageUrl} -->`);
            lines.push(`<!-- ${divider} -->`);
            lines.push('');

            for (const result of results) {
              const rule = run.tool.driver.rules[result.ruleIndex] || {};
              const severity = rule.properties?.['security-severity'] || '?';
              const category = rule.properties?.category || '?';
              const html = result.properties?.html || result.locations?.[0]?.logicalLocations?.[0]?.name || '<!-- element not captured -->';

              // Comment line with rule metadata
              lines.push(`<!-- [${result.ruleId}] ${rule.name || result.ruleId} | severity: ${severity} | category: ${category} -->`);

              // The HTML element line — this is what SARIF will point to
              const elementLine = lines.length + 1; // +1 because lines are 0-indexed but line numbers are 1-indexed

              lines.push(html);
              lines.push('');

              // Rewrite this result's location to point to the composite file
              if (result.locations?.[0]) {
                result.locations[0].physicalLocation = {
                  artifactLocation: { uri: COMPOSITE_FILE },
                  region: { startLine: elementLine },
                };
              }

              // Remove old fingerprints — let GitHub calculate fresh ones
              // from the composite file content
              delete result.partialFingerprints;
            }
          }

          // ── 3. Set artifacts to reference the composite file ────────
          run.artifacts = [{ location: { uri: COMPOSITE_FILE } }];

          // ── 4. Write both files atomically ──────────────────────────
          const compositeContent = lines.join('\n');
          const sarifContent = JSON.stringify(base, null, 2);

          // Composite file goes in the repo root (where checkout happened)
          fs.writeFileSync(path.join(repoRoot, COMPOSITE_FILE), compositeContent);

          // Combined SARIF goes in reports dir
          fs.writeFileSync(path.join(reportsDir, 'combined.sarif'), sarifContent);

          console.log(`Composite file: ${COMPOSITE_FILE} (${lines.length} lines)`);
          console.log(`Combined SARIF: ${run.results.length} results across ${resultsByPage.size} pages`);
          console.log(`Rules: ${rulesMap.size}`);
          BUILDsarif

      - name: Commit composite findings file
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f security-audit-results-playwright.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add security-audit-results-playwright.html
            git diff --cached --quiet || git commit -m "Update security audit findings (Playwright)"
            git pull --rebase
            git push
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: qastell-demo/reports/combined.sarif
          category: qastell-playwright
        continue-on-error: true

      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qastell-playwright-reports
          path: qastell-demo/reports/

  # ─── Puppeteer ───────────────────────────────────────────────
  puppeteer:
    name: Puppeteer Security Audit
    runs-on: ubuntu-latest
    if: github.actor == 'robintel'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scaffold project and install dependencies
        run: |
          mkdir -p qastell-demo/reports
          cd qastell-demo
          npm init -y
          npm i qastell puppeteer

      - name: Run security audit
        working-directory: qastell-demo
        env:
          QASTELL_LICENSE: ${{ secrets.QASTELL_LICENSE }}
        run: |
          node << 'SCRIPT'
          const puppeteer = require('puppeteer');
          const { SecurityAuditor, formatters } = require('qastell');
          const fs = require('fs');
          const path = require('path');

          const REPORTS_DIR = path.join(process.cwd(), 'reports');
          const BASE_URL = 'https://the-internet.herokuapp.com';

          const PAGES = [
            { path: '/', name: 'Homepage' },
            { path: '/login', name: 'Login Page' },
          ];

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });

            let totalViolations = 0;

            for (const target of PAGES) {
              const page = await browser.newPage();
              await page.goto(`${BASE_URL}${target.path}`, { waitUntil: 'networkidle0' });

              const auditor = new SecurityAuditor(page);
              const results = await auditor.audit();

              const slug = target.name.toLowerCase().replace(/\s+/g, '-');
              fs.writeFileSync(path.join(REPORTS_DIR, `${slug}.html`), results.toHTML());
              fs.writeFileSync(path.join(REPORTS_DIR, `${slug}.json`), results.toJSON());
              fs.writeFileSync(path.join(REPORTS_DIR, `${slug}.sarif`), results.toSARIF());

              const md = formatters.markdown(results.raw, { tier: results.tier });
              fs.writeFileSync(path.join(REPORTS_DIR, `${slug}.md`), md);

              totalViolations += results.summary.total;
              console.log(`${target.name}: ${results.summary.total} issues`);
              console.log(`  Critical: ${results.summary.bySeverity.critical} | High: ${results.summary.bySeverity.high}`);

              await page.close();
            }

            await browser.close();

            // Fail with non-zero exit code if violations were found
            if (totalViolations > 0) {
              console.error(`\nSecurity audit FAILED: ${totalViolations} total violations found`);
              process.exit(1);
            }
          })();
          SCRIPT

      - name: Post markdown summary to job
        if: always()
        working-directory: qastell-demo
        run: |
          echo "# QAstell Puppeteer Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for md_file in reports/*.md; do
            if [ -f "$md_file" ]; then
              cat "$md_file" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "---" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Build composite findings file and SARIF for GitHub
        if: always()
        run: |
          node << 'BUILDsarif'
          const fs = require('fs');
          const path = require('path');

          const reportsDir = path.join(process.cwd(), 'qastell-demo', 'reports');
          const repoRoot = process.env.GITHUB_WORKSPACE || process.cwd();
          const COMPOSITE_FILE = 'security-audit-results-puppeteer.html';

          const sarifFiles = fs.readdirSync(reportsDir)
            .filter(f => f.endsWith('.sarif') && f !== 'combined.sarif');

          if (sarifFiles.length === 0) {
            console.log('No SARIF files found');
            process.exit(0);
          }

          const base = JSON.parse(fs.readFileSync(path.join(reportsDir, sarifFiles[0]), 'utf8'));
          const run = base.runs[0];
          const rulesMap = new Map();
          run.tool.driver.rules.forEach(r => rulesMap.set(r.id, r));
          const allResults = [...run.results];

          for (let i = 1; i < sarifFiles.length; i++) {
            const sarif = JSON.parse(fs.readFileSync(path.join(reportsDir, sarifFiles[i]), 'utf8'));
            const r = sarif.runs[0];
            r.tool.driver.rules.forEach(rule => rulesMap.set(rule.id, rule));
            allResults.push(...r.results);
          }

          run.tool.driver.rules = [...rulesMap.values()];
          run.results = allResults;

          const ruleIds = run.tool.driver.rules.map(r => r.id);
          for (const result of run.results) {
            result.ruleIndex = ruleIds.indexOf(result.ruleId);
          }

          const resultsByPage = new Map();
          for (const result of run.results) {
            const uri = result.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'unknown';
            if (!resultsByPage.has(uri)) resultsByPage.set(uri, []);
            resultsByPage.get(uri).push(result);
          }

          const lines = [];
          lines.push('<!--');
          lines.push('  QAstell Security Audit Results — Puppeteer');
          lines.push(`  Generated: ${new Date().toISOString()}`);
          lines.push(`  Pages scanned: ${resultsByPage.size}`);
          lines.push(`  Total findings: ${run.results.length}`);
          lines.push('');
          lines.push('  This file is auto-generated during the CI workflow.');
          lines.push('  Each finding references the HTML element that triggered it.');
          lines.push('  GitHub Code Scanning alerts link to specific lines below.');
          lines.push('-->');
          lines.push('');

          for (const [pageUrl, results] of resultsByPage) {
            const divider = '\u2550'.repeat(62);
            lines.push(`<!-- ${divider} -->`);
            lines.push(`<!-- Page: ${pageUrl} -->`);
            lines.push(`<!-- ${divider} -->`);
            lines.push('');

            for (const result of results) {
              const rule = run.tool.driver.rules[result.ruleIndex] || {};
              const severity = rule.properties?.['security-severity'] || '?';
              const category = rule.properties?.category || '?';
              const html = result.properties?.html || result.locations?.[0]?.logicalLocations?.[0]?.name || '<!-- element not captured -->';

              lines.push(`<!-- [${result.ruleId}] ${rule.name || result.ruleId} | severity: ${severity} | category: ${category} -->`);

              const elementLine = lines.length + 1;
              lines.push(html);
              lines.push('');

              if (result.locations?.[0]) {
                result.locations[0].physicalLocation = {
                  artifactLocation: { uri: COMPOSITE_FILE },
                  region: { startLine: elementLine },
                };
              }

              // Remove old fingerprints — let GitHub calculate fresh ones
              // from the composite file content
              delete result.partialFingerprints;
            }
          }

          run.artifacts = [{ location: { uri: COMPOSITE_FILE } }];

          const compositeContent = lines.join('\n');
          const sarifContent = JSON.stringify(base, null, 2);

          fs.writeFileSync(path.join(repoRoot, COMPOSITE_FILE), compositeContent);
          fs.writeFileSync(path.join(reportsDir, 'combined.sarif'), sarifContent);

          console.log(`Composite file: ${COMPOSITE_FILE} (${lines.length} lines)`);
          console.log(`Combined SARIF: ${run.results.length} results across ${resultsByPage.size} pages`);
          console.log(`Rules: ${rulesMap.size}`);
          BUILDsarif

      - name: Commit composite findings file
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f security-audit-results-puppeteer.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add security-audit-results-puppeteer.html
            git diff --cached --quiet || git commit -m "Update security audit findings (Puppeteer)"
            git pull --rebase
            git push
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: qastell-demo/reports/combined.sarif
          category: qastell-puppeteer
        continue-on-error: true

      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qastell-puppeteer-reports
          path: qastell-demo/reports/

  # ─── Deploy Reports to GitHub Pages ────────────────────────
  deploy-reports:
    name: Deploy Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [playwright, puppeteer]
    if: always() && github.actor == 'robintel'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Playwright reports
        uses: actions/download-artifact@v4
        with:
          name: qastell-playwright-reports
          path: site/playwright
        continue-on-error: true

      - name: Download Puppeteer reports
        uses: actions/download-artifact@v4
        with:
          name: qastell-puppeteer-reports
          path: site/puppeteer
        continue-on-error: true

      - name: Generate index page
        run: |
          node << 'INDEX'
          const fs = require('fs');
          const path = require('path');

          const siteDir = path.join(process.cwd(), 'site');
          const timestamp = new Date().toISOString().replace('T', ' ').split('.')[0] + ' UTC';

          // Collect reports per framework
          function collectReports(framework) {
            const dir = path.join(siteDir, framework);
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir)
              .filter(f => f.endsWith('.html') && !f.endsWith('-summary.html') && f !== 'combined.sarif')
              .sort()
              .map(f => {
                const name = f.replace('.html', '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                return { file: f, name };
              });
          }

          const playwrightReports = collectReports('playwright');
          const puppeteerReports = collectReports('puppeteer');

          const html = `<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>QAstell Security Audit Reports</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
              .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
              h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
              h1 span { color: #58a6ff; }
              .subtitle { color: #8b949e; margin-bottom: 2rem; font-size: 0.95rem; }
              .badge { display: inline-block; background: #1f6feb; color: #fff; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; vertical-align: middle; margin-left: 0.5rem; }
              .framework { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 1.5rem; overflow: hidden; }
              .framework-header { padding: 1rem 1.25rem; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 0.5rem; }
              .framework-header h2 { font-size: 1.2rem; font-weight: 600; }
              .report-list { list-style: none; }
              .report-list li { border-bottom: 1px solid #21262d; }
              .report-list li:last-child { border-bottom: none; }
              .report-list a { display: block; padding: 0.75rem 1.25rem; color: #58a6ff; text-decoration: none; transition: background 0.15s; }
              .report-list a:hover { background: #1c2128; }
              .report-list .filename { color: #8b949e; font-size: 0.8rem; margin-left: 0.5rem; }
              .empty { padding: 1rem 1.25rem; color: #8b949e; font-style: italic; }
              .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #30363d; color: #8b949e; font-size: 0.85rem; text-align: center; }
              .footer a { color: #58a6ff; text-decoration: none; }
              .meta { display: flex; gap: 2rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: #8b949e; }
              .meta span { display: flex; align-items: center; gap: 0.3rem; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>&#128737; <span>QAstell</span> Security Audit Reports</h1>
              <p class="subtitle">Automated security scans of <a href="https://the-internet.herokuapp.com" style="color:#58a6ff">the-internet.herokuapp.com</a></p>
              <div class="meta">
                <span>&#128197; ${timestamp}</span>
                <span>&#128279; <a href="https://github.com/robintel/qastell-community/actions" style="color:#58a6ff">View workflow runs</a></span>
              </div>

              <div class="framework">
                <div class="framework-header">
                  <h2>Playwright</h2>
                  <span class="badge">${playwrightReports.length} pages</span>
                </div>
                ${playwrightReports.length > 0
                  ? '<ul class="report-list">' + playwrightReports.map(r =>
                      '<li><a href="playwright/' + r.file + '">' + r.name + '<span class="filename">' + r.file + '</span></a></li>'
                    ).join('') + '</ul>'
                  : '<p class="empty">No reports available (job may have been skipped)</p>'
                }
              </div>

              <div class="framework">
                <div class="framework-header">
                  <h2>Puppeteer</h2>
                  <span class="badge">${puppeteerReports.length} pages</span>
                </div>
                ${puppeteerReports.length > 0
                  ? '<ul class="report-list">' + puppeteerReports.map(r =>
                      '<li><a href="puppeteer/' + r.file + '">' + r.name + '<span class="filename">' + r.file + '</span></a></li>'
                    ).join('') + '</ul>'
                  : '<p class="empty">No reports available (job may have been skipped)</p>'
                }
              </div>

              <div class="footer">
                <p>Generated by <a href="https://qastell.eu">QAstell</a> &mdash; Security Auditing for SDETs</p>
